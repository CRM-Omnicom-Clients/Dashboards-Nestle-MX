<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporte Consolidado CRM HIVE Nestlé MX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7ff;--sur:#fff;--bd:#e9d5ff;--tx:#1a0028;--mu:#6b21a8;--fa:#a855f7;--ac:#9333ea;--po:#059669;--wa:#d946ef;--sh:120px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Gotham','Montserrat','Century Gothic','Trebuchet MS',sans-serif;background:var(--bg);color:var(--tx);font-size:13px}

/* Page-level sticky header */
#top{position:sticky;top:0;z-index:40;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.hdr{background:linear-gradient(135deg,#0d001a 0%,#2d0045 30%,#1a0030 65%,#060008 100%);border-bottom:1px solid #6b21a8;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:20px;font-weight:800;letter-spacing:.3px;background:linear-gradient(135deg,#f0abfc 0%,#e879f9 25%,#ec4899 55%,#be185d 85%,#f0abfc 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#e879f9}
.hdr small{font-size:12px;color:#d8b4fe;display:block;margin-top:3px}
.v1{background:linear-gradient(135deg,#ec4899,#f472b6,#be185d);color:#fff;border-radius:5px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.5px}
.flt{background:linear-gradient(180deg,#1a0028 0%,#0a0010 100%);border-bottom:1px solid #6b21a8;padding:7px 20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.flt label{font-size:12px;color:#c084fc;font-weight:600}
.flt select{font-size:12px;padding:4px 8px;border:1px solid #7e22ce;border-radius:5px;background:#1a0028;color:#e9d5ff;cursor:pointer}
.flt .div{color:#7e22ce}
#fcnt{margin-left:auto;font-size:11px;color:#a855f7;font-style:italic}
.tabs{display:flex;padding:0 20px;border-bottom:2px solid #7e22ce;background:linear-gradient(180deg,#1a0028 0%,#0a000f 100%)}
.tab{padding:9px 17px;cursor:pointer;font-size:13px;font-weight:600;color:#a78bfa;border-bottom:2px solid transparent;white-space:nowrap;letter-spacing:.2px}
.tab:hover{color:#e879f9}
.tab.on{color:#f472b6;border-bottom-color:#ec4899}
.cnt{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:1px 5px;font-size:10px;margin-left:4px;color:var(--fa)}

/* Content */
.content{padding:12px 18px}
.pnl{display:none}.pnl.on{display:block}

/* Table wrapper — scroll both axes; thead top:0 sticks within here */
.tw{
  background:var(--sur);border:1px solid var(--bd);border-radius:7px;
  overflow:auto;
  max-height:calc(100vh - var(--sh) - 24px);
}
table{width:max-content;border-collapse:collapse;white-space:nowrap}
thead{position:sticky;top:0;z-index:20;}

/* Base rows */
td{background:#fff;padding:5px 8px;font-size:12px;vertical-align:middle;border-bottom:1px solid var(--bd);}
tbody tr:nth-child(even) td{background:#f8fafc;}
tbody tr:hover td{background:#f3e8ff;}
.cr td{background:linear-gradient(90deg,#3d0060 0%,#1a0028 100%)!important;font-size:11px;font-weight:700;color:#f0abfc;text-transform:uppercase;letter-spacing:.5px;padding:5px 9px;border-top:2px solid #7e22ce;border-bottom:1px solid #3d0060;}

/* td helpers */
td.r{text-align:right}
td.na{color:var(--fa);text-align:center}
td.hi{color:var(--po);font-weight:600;text-align:right}
td.lo{color:var(--wa);text-align:right}
td.mu{color:var(--mu);text-align:right}
th.r{text-align:right}
.sep,th.sep,td.sep{border-right:2px solid #c084fc!important}
.sxp,th.sxp,td.sxp{border-right:1px dashed #d8b4fe!important}
.tn{overflow:hidden;text-overflow:ellipsis;display:block}
.nm b{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:block}
.nm s{font-size:9px;color:var(--fa);display:block;margin-top:1px;text-decoration:none}

/* Group header rows */
thead tr.gr th{padding:5px 8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:center;border-bottom:1px solid rgba(255,255,255,.12);}
th.gd{background:linear-gradient(180deg,#f5f0ff 0%,#ede9fe 100%);color:#1a0028}
th.gp{background:linear-gradient(180deg,#fce7f3 0%,#fbcfe8 100%);color:#831843}
th.gf{background:linear-gradient(180deg,#f3e8ff 0%,#e9d5ff 100%);color:#4c1d95}
th.gt{background:linear-gradient(180deg,#fdf4ff 0%,#fae8ff 100%);color:#701a75}
th.gq{background:linear-gradient(180deg,#fff1f2 0%,#fce7f3 100%);color:#881337}
th.gw{background:linear-gradient(180deg,#fdf4ff 0%,#f5d0fe 100%);color:#701a75}
thead tr.gc th{padding:5px 7px;font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--bd);}

/* KPI cards */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--sur);border-radius:8px;padding:12px 15px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:4px solid var(--ac)}
.kpi .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.kpi .v{font-size:21px;font-weight:700;color:var(--tx);margin:3px 0}
.kpi .s{font-size:10px;color:var(--fa)}

/* Sticky column positions */
.e0{position:sticky;left:0px;min-width:50px;max-width:50px;z-index:2;}
thead .e0{z-index:30;}
.e1{position:sticky;left:50px;min-width:80px;max-width:80px;z-index:2;}
thead .e1{z-index:30;}
.e2{position:sticky;left:130px;min-width:90px;max-width:90px;z-index:2;}
thead .e2{z-index:30;}
.e3{position:sticky;left:220px;min-width:62px;max-width:62px;z-index:2;}
thead .e3{z-index:30;}
.e4{position:sticky;left:282px;min-width:80px;max-width:80px;z-index:2;}
thead .e4{z-index:30;}
.e5{position:sticky;left:362px;min-width:90px;max-width:90px;z-index:2;}
thead .e5{z-index:30;}
.e6{position:sticky;left:452px;min-width:44px;max-width:44px;z-index:2;box-shadow:3px 0 6px rgba(0,0,0,.12);}
thead .e6{z-index:30;}
.w0{position:sticky;left:0px;min-width:50px;max-width:50px;z-index:2;}
thead .w0{z-index:30;}
.w1{position:sticky;left:50px;min-width:80px;max-width:80px;z-index:2;}
thead .w1{z-index:30;}
.w2{position:sticky;left:130px;min-width:90px;max-width:90px;z-index:2;}
thead .w2{z-index:30;}
.w3{position:sticky;left:220px;min-width:62px;max-width:62px;z-index:2;}
thead .w3{z-index:30;}
.w4{position:sticky;left:282px;min-width:80px;max-width:80px;z-index:2;}
thead .w4{z-index:30;}
.w5{position:sticky;left:362px;min-width:90px;max-width:90px;z-index:2;box-shadow:3px 0 6px rgba(0,0,0,.12);}
thead .w5{z-index:30;}

/* Sticky column backgrounds */
td.e0,td.e1,td.e2,td.e3,td.e4,td.e5,td.e6{background:#fff;}
tbody tr:nth-child(even) td.e0,tbody tr:nth-child(even) td.e1,tbody tr:nth-child(even) td.e2,tbody tr:nth-child(even) td.e3,tbody tr:nth-child(even) td.e4,tbody tr:nth-child(even) td.e5,tbody tr:nth-child(even) td.e6{background:#f8fafc;}
tbody tr:hover td.e0,tbody tr:hover td.e1,tbody tr:hover td.e2,tbody tr:hover td.e3,tbody tr:hover td.e4,tbody tr:hover td.e5,tbody tr:hover td.e6{background:#e8f0fe;}
.camp-row td.e0,.camp-row td.e1,.camp-row td.e2,.camp-row td.e3,.camp-row td.e4,.camp-row td.e5,.camp-row td.e6{background:#e3ebf6!important;}
thead .e0,thead .e1,thead .e2,thead .e3,thead .e4,thead .e5,thead .e6{background:#f0f4f8!important;}
td.w0,td.w1,td.w2,td.w3,td.w4,td.w5{background:#fff;}
tbody tr:nth-child(even) td.w0,tbody tr:nth-child(even) td.w1,tbody tr:nth-child(even) td.w2,tbody tr:nth-child(even) td.w3,tbody tr:nth-child(even) td.w4,tbody tr:nth-child(even) td.w5{background:#f8fafc;}
tbody tr:hover td.w0,tbody tr:hover td.w1,tbody tr:hover td.w2,tbody tr:hover td.w3,tbody tr:hover td.w4,tbody tr:hover td.w5{background:#f3e8ff;}
.camp-row td.w0,.camp-row td.w1,.camp-row td.w2,.camp-row td.w3,.camp-row td.w4,.camp-row td.w5{background:#f3e8ff!important;}
thead .w0,thead .w1,thead .w2,thead .w3,thead .w4,thead .w5{background:#faf5ff!important;}

/* Sort */
th[data-srt]{cursor:pointer;user-select:none;}
th[data-srt]:hover{background:#f3e8ff!important;}
th[data-srt]:not(.sa):not(.sd)::after{content:' ⇅';font-size:8px;opacity:.3;}
th[data-srt].sa::after{content:' ↑';font-size:8px;opacity:.85;}
th[data-srt].sd::after{content:' ↓';font-size:8px;opacity:.85;}
/* Totals per campaign */
.tot-row td{background:#f3e8ff!important;font-weight:700;font-size:10px;border-top:2px solid #9333ea;border-bottom:2px solid #9333ea;}
.tot-row td.e0,.tot-row td.e1,.tot-row td.e2,.tot-row td.e3,.tot-row td.e4,.tot-row td.e5,.tot-row td.e6{background:#ede9fe!important;}
.tot-row td.w0,.tot-row td.w1,.tot-row td.w2,.tot-row td.w3,.tot-row td.w4,.tot-row td.w5{background:#ede9fe!important;}

</style>
</head>
<body>

<div id="top">
  <div class="hdr">
    <div>
      <h1>Reporte Consolidado CRM HIVE Nestlé MX</h1>
      <small id="upd">Email · WhatsApp · Qcart</small>
    </div>
    <span class="v1">v1</span>
  </div>
  <div class="flt">
    <label>Marca</label><select id="fm" onchange="go()"><option value="">Todas</option></select>
    <label>BU</label><select id="fb" onchange="go()"><option value="">Todos</option></select>
    <span class="div">|</span>
    <label>Campaña</label><select id="fc" onchange="go()"><option value="">Todas</option></select>
    <span class="div">|</span>
    <label>Mes</label><select id="fx" onchange="go()"><option value="">Todos</option></select>
    <span class="div">|</span>
    <label>Quincena</label><select id="fq" onchange="go()"><option value="">Todas</option></select>
    <span id="fcnt"></span>
  </div>
  <div class="tabs">
    <div class="tab on" onclick="tab(this,'ao')">Email Continuo (AON)<span class="cnt" id="nao"></span></div>
    <div class="tab" onclick="tab(this,'os')">Email Único (One-Shot)<span class="cnt" id="nos"></span></div>
    <div class="tab" onclick="tab(this,'wa')">WhatsApp<span class="cnt" id="nwa"></span></div>
    <div class="tab" onclick="tab(this,'rs')">Resumen</div>
  </div>
</div>

<div class="content">
  <div class="pnl on" id="pao"></div>
  <div class="pnl"    id="pos"></div>
  <div class="pnl"    id="pwa"></div>
  <div class="pnl"    id="prs"></div>
</div>

<script src="reporte-datos.js"></script>
<script>

const MA = {'01':'Ene','02':'Feb','03':'Mar','04':'Abr','05':'May','06':'Jun','07':'Jul','08':'Ago','09':'Sep','10':'Oct','11':'Nov','12':'Dic'};
const MN = {'01':'Enero','02':'Febrero','03':'Marzo','04':'Abril','05':'Mayo','06':'Junio','07':'Julio','08':'Agosto','09':'Septiembre','10':'Octubre','11':'Noviembre','12':'Diciembre'};
const mes  = m => { if(!m) return'—'; const[,mo]=m.split('-'); return MA[mo]||mo; };
const mesl = m => { if(!m) return'—'; const[y,mo]=m.split('-'); return (MN[mo]||mo)+' '+y; };
const fmt  = v => v==null?'—':Number(v).toLocaleString('es-MX');
const pct  = v => v==null?'—':Number(v).toFixed(1)+'%';
const mxn  = v => v==null?'—':'$'+Number(v).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0});
const rC   = (v,hi,lo) => v==null?'na':v>=hi?'hi':v<=lo?'lo':'mu';
const rP   = (n,d) => (n==null||!d)?null:+(n/d*100).toFixed(1);
const tr   = (s,n) => s?(s.length>n?s.slice(0,n)+'…':s):'—';

const SRT={aon:{f:null,d:1},os:{f:null,d:1},wa:{f:null,d:1}};
function srt(p,f){const s=SRT[p];s.d=s.f===f?-s.d:1;s.f=f;go();}
function sc(p,f){const s=SRT[p];return s.f===f?(s.d===1?' sa':' sd'):'';}
function srtRows(rows,p){
  const s=SRT[p];if(!s.f)return rows;
  return[...rows].sort((a,b)=>{
    const av=a[s.f],bv=b[s.f];
    if(av==null&&bv==null)return 0;
    if(av==null)return 1*s.d;if(bv==null)return -1*s.d;
    const an=+av,bn=+bv;
    if(!isNaN(an)&&!isNaN(bn))return(an-bn)*s.d;
    return String(av).localeCompare(String(bv),'es')*s.d;
  });
}
function eTotRow(rows){
  if(rows.length<2)return'';
  const S=f=>rows.reduce((a,r)=>a+(+(r[f]||0)),0);
  const rp=(n,d)=>d?(n/d*100).toFixed(1)+'%':'—';
  const psn=S('p_sends'),pop=S('p_opens'),pcl=S('p_clicks'),
        pun=S('p_unsubs'),pcta=S('p_clicks_cta'),pbj=S('p_clicks_baja');
  const fRows=rows.filter(r=>r.fup_pieza_id!=null), fHas=fRows.length>0;
  const FS=f=>fRows.reduce((a,r)=>a+(+(r[f]||0)),0);
  const fsn=FS('fup_sends'),fop=FS('fup_opens'),fcl=FS('fup_clicks'),
        fun=FS('fup_unsubs'),fcta=FS('fup_clicks_cta'),fbj=FS('fup_clicks_baja');
  const tsn=S('tot_sends'),top=S('tot_opens'),tcl=S('tot_clicks'),
        tun=S('tot_unsubs'),tcta=S('tot_clicks_cta'),tbj=S('tot_clicks_baja');
  return`<tr class="tot-row">
    <td class="e0"></td><td class="e1"></td><td class="e2"></td><td class="e3"></td><td class="e4"></td><td class="e5"></td>
    <td class="e6 sep"></td>
    <td colspan="4" style="text-align:right;font-size:9px;color:#3b5a8a;padding-right:8px;font-style:italic">∑ campaña</td>
    <td class="r gp">${fmt(psn)}</td><td class="r gp">${fmt(pop)}</td><td class="gp">${rp(pop,psn)}</td>
    <td class="r gp">${fmt(pcl)}</td><td class="gp">${rp(pcl,pop)}</td>
    <td class="r gp">${fmt(pun)}</td><td class="gp">${rp(pun,psn)}</td>
    <td class="r gp">${fmt(pcta)}</td><td class="gp">${rp(pcta,pcl)}</td>
    <td class="r gp">${fmt(pbj)}</td><td class="gp sxp">${rp(pbj,pcl)}</td>
    <td class="na gf" colspan="3">—</td>
    ${fHas?`<td class="r gf">${fmt(fsn)}</td><td class="r gf">${fmt(fop)}</td><td class="gf">${rp(fop,fsn)}</td><td class="r gf">${fmt(fcl)}</td><td class="gf">${rp(fcl,fop)}</td><td class="r gf">${fmt(fun)}</td><td class="gf">${rp(fun,fsn)}</td><td class="r gf">${fmt(fcta)}</td><td class="gf">${rp(fcta,fcl)}</td><td class="r gf">${fmt(fbj)}</td><td class="gf sxp">${rp(fbj,fcl)}</td>`:'<td class="na gf sxp" colspan="11">—</td>'}
    <td class="r gt">${fmt(tsn)}</td><td class="r gt">${fmt(top)}</td><td class="gt">${rp(top,tsn)}</td>
    <td class="r gt">${fmt(tcl)}</td><td class="gt">${rp(tcl,top)}</td>
    <td class="r gt">${fmt(tun)}</td><td class="gt">${rp(tun,tsn)}</td>
    <td class="r gt">${fmt(tcta)}</td><td class="gt">${rp(tcta,tcl)}</td>
    <td class="r gt">${fmt(tbj)}</td><td class="gt sxp">${rp(tbj,tcl)}</td>
    ${(()=>{const qr=rows.filter(r=>r._qc);if(!qr.length)return'<td class="na" colspan="13">\u2014</td>';const QS=f=>qr.reduce((a,r)=>a+(+(r._qc[f]||0)),0);const qcw=QS('cw'),qcc=QS('cc'),qct=QS('ct'),qvc=QS('vc'),qvpn=QS('vpn'),qitn=QS('itn'),qinn=QS('inn');const qpct=qitn?(qinn/qitn*100).toFixed(1):null;const qtktc=qct?(qitn/qct):null;const qtktp=qvpn?(qinn/qvpn):null;return`<td class="gq" colspan="3">\u2014</td><td class="r gq">${fmt(qcw)}</td><td class="r gq">${fmt(qcc)}</td><td class="r gq" style="font-weight:700">${fmt(qct)}</td><td class="r gq">${fmt(qvc)}</td><td class="r gq">${fmt(qvpn)}</td><td class="r gq">${mxn(qitn)}</td><td class="r gq">${mxn(qinn)}</td><td class="mu gq">${qpct!=null?qpct+'%':'\u2014'}</td><td class="r gq">${qtktc!=null?mxn(qtktc):'\u2014'}</td><td class="r gq">${qtktp!=null?mxn(qtktp):'\u2014'}</td>`;})()}
  </tr>`;
}
function wTotRow(rows,hq){
  if(rows.length<2)return'';
  const S=f=>rows.reduce((a,r)=>a+(+(r[f]||0)),0);
  const sn=S('sends'),dl=S('deliveries'),nd=S('no_entregados'),rd=S('opens_read'),cl=S('clicks');
  const rp=(n,d)=>d?(n/d*100).toFixed(1)+'%':'—';
  return`<tr class="tot-row">
    <td class="w0"></td><td class="w1"></td><td class="w2"></td><td class="w3"></td><td class="w4"></td>
    <td class="w5 sep"></td>
    <td colspan="2" style="text-align:right;font-size:9px;color:#3b5a8a;padding-right:8px;font-style:italic">∑ campaña</td>
    <td class="sep"></td>
    <td class="r gw">${fmt(sn)}</td><td class="r gw">${fmt(dl)}</td><td class="gw">${rp(dl,sn)}</td>
    <td class="r gw">${fmt(nd)}</td><td class="gw">${rp(nd,sn)}</td>
    <td class="r gw">${fmt(rd)}</td><td class="gw">${rp(rd,dl)}</td>
    <td class="r gw">${fmt(cl)}</td><td class="gw${hq?' sxp':''}">${rp(cl,rd)}</td>
    ${hq?(()=>{const qr=rows.filter(r=>r._qc);if(!qr.length)return'<td class="na" colspan="13">\u2014</td>';const QS=f=>qr.reduce((a,r)=>a+(+(r._qc[f]||0)),0);const qcw=QS('cw'),qcc=QS('cc'),qct=QS('ct'),qvc=QS('vc'),qvpn=QS('vpn'),qitn=QS('itn'),qinn=QS('inn');const qpct=qitn?(qinn/qitn*100).toFixed(1):null;const qtktc=qct?(qitn/qct):null;const qtktp=qvpn?(qinn/qvpn):null;return`<td class="gq" colspan="3">\u2014</td><td class="r gq">${fmt(qcw)}</td><td class="r gq">${fmt(qcc)}</td><td class="r gq" style="font-weight:700">${fmt(qct)}</td><td class="r gq">${fmt(qvc)}</td><td class="r gq">${fmt(qvpn)}</td><td class="r gq">${mxn(qitn)}</td><td class="r gq">${mxn(qinn)}</td><td class="mu gq">${qpct!=null?qpct+'%':'\u2014'}</td><td class="r gq">${qtktc!=null?mxn(qtktc):'\u2014'}</td><td class="r gq">${qtktp!=null?mxn(qtktp):'\u2014'}</td>`;})():''
  }
  </tr>`;
}
/* 11 metric cols */
function mc(sn,op,or_,cl,ct,un,ut,cta,bja,g,sep){
  if(sn==null) return `<td class="na" colspan="11">—</td>`;
  const pC=rP(cta,cl), pB=rP(bja,cl), sx=sep?' sxp':'';
  return [`<td class="r ${g}">${fmt(sn)}</td>`,
          `<td class="r ${g}">${fmt(op)}</td>`,
          `<td class="${rC(or_,30,10)} ${g}">${pct(or_)}</td>`,
          `<td class="r ${g}">${fmt(cl)}</td>`,
          `<td class="${rC(ct,3,0.5)} ${g}">${pct(ct)}</td>`,
          `<td class="r ${g}">${fmt(un)}</td>`,
          `<td class="mu ${g}">${pct(ut)}</td>`,
          `<td class="r ${g}">${fmt(cta)}</td>`,
          `<td class="mu ${g}">${pct(pC)}</td>`,
          `<td class="r ${g}">${fmt(bja)}</td>`,
          `<td class="mu${sx} ${g}">${pct(pB)}</td>`].join('');
}

function qcCols(q){
  if(!q) return `<td class="na" colspan="13">—</td>`;
  return [
    `<td class="gq" title="${q.rec||''}">${tr(q.rec,16)}</td>`,
    `<td class="r gq">${q.fd||'—'}</td>`,
    `<td class="r gq">${q.fh||'—'}</td>`,
    `<td class="r gq">${fmt(q.cw)}</td>`,
    `<td class="r gq">${fmt(q.cc)}</td>`,

function eTbl(rows, pnl='aon'){
  if(!rows.length) return '<p style="padding:20px;color:#9ca3af">Sin datos.</p>';
  const camps=[...new Set(rows.map(r=>r.campana||'Sin campaña'))];
  const flat=rows.map(r=>({...r,_qc_rec:r._qc?.rec,_qc_fd:r._qc?.fd,_qc_fh:r._qc?.fh,_qc_cw:r._qc?.cw,_qc_cc:r._qc?.cc,_qc_ct:r._qc?.ct,_qc_vc:r._qc?.vc,_qc_vpn:r._qc?.vpn,_qc_itn:r._qc?.itn,_qc_inn:r._qc?.inn,_qc_pct:r._qc?.pct,_qc_tkt_c:r._qc?.tkt_c,_qc_tkt_p:r._qc?.tkt_p}));
  const sr=srtRows(flat,pnl);
  let tb='';
  for(const c of camps){
    const cr=sr.filter(r=>(r.campana||'Sin campaña')===c);
    tb+=`<tr class="cr"><td colspan="62">${c} <span style="font-weight:400;text-transform:none;font-size:10px;color:var(--fa)">${cr.length} piezas</span></td></tr>`;
    tb+=cr.map(eRow).join('');
    tb+=eTotRow(cr);
  }
  return `<div class="tw"><table>${eHead(pnl)}<tbody>${tb}</tbody></table></div>`;
}

function wTbl(rows, pnl='wa'){
  if(!rows.length) return '<p style="padding:20px;color:#9ca3af">Sin datos.</p>';
  const hq=rows.some(r=>r._qc);
  const camps=[...new Set(rows.map(r=>r.campana||'Sin campaña'))];
  const flat=rows.map(r=>({...r,_qc_rec:r._qc?.rec,_qc_fd:r._qc?.fd,_qc_fh:r._qc?.fh,_qc_cw:r._qc?.cw,_qc_cc:r._qc?.cc,_qc_ct:r._qc?.ct,_qc_vc:r._qc?.vc,_qc_vpn:r._qc?.vpn,_qc_itn:r._qc?.itn,_qc_inn:r._qc?.inn,_qc_pct:r._qc?.pct,_qc_tkt_c:r._qc?.tkt_c,_qc_tkt_p:r._qc?.tkt_p}));
  const sr=srtRows(flat,pnl);
  let tb='';
  for(const c of camps){
    const cr=sr.filter(r=>(r.campana||'Sin campaña')===c);
    tb+=`<tr class="cr"><td colspan="${hq?31:18}">${c} <span style="font-weight:400;text-transform:none;font-size:10px;color:var(--fa)">${cr.length} envíos</span></td></tr>`;

  return `<div class="tw"><table>${wHead(hq,pnl)}<tbody>${tb}</tbody></table></div>`;
}

function rsm(aon,os,wa){
  const sE=rows=>rows.reduce((a,r)=>{a.sn+=(r.p_sends||0);a.op+=(r.p_opens||0);a.cl+=(r.p_clicks_cta||0);return a;},{sn:0,op:0,cl:0});

  const wS=wa.reduce((a,r)=>{a.sn+=(r.sends||0);a.rd+=(r.opens_read||0);return a;},{sn:0,rd:0});
  const kpi=(l,v,s,c)=>`<div class="kpi" style="border-left-color:${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  return `<div class="kgrid">
    ${kpi('Email AON Sends',fmt(aS.sn),aon.length+' piezas · OR '+(aS.sn?pct(aS.op/aS.sn*100):'—'),'#0f766e')}
    ${kpi('Email OS Sends',fmt(oS.sn),os.length+' piezas · OR '+(oS.sn?pct(oS.op/oS.sn*100):'—'),'#7c3aed')}
    ${kpi('WA Sends',fmt(wS.sn),wa.length+' envíos · Read '+(wS.sn?pct(wS.rd/wS.sn*100):'—'),'#b45309')}
    ${kpi('Clicks CTA Email',fmt(aS.cl+oS.cl),'AON + One-Shot','#1d4ed8')}
  </div>`;
}

function tab(el,id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.pnl').forEach(p=>p.classList.remove('on'));
  document.getElementById('p'+id).classList.add('on');
  el.classList.add('on');
}

populateSel();go();
window.addEventListener('resize',setSH);
</script>
